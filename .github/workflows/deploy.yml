name: Deploy to GitHub Pages

# One Pages site per repo, so both branches build into a single artifact:
#   main   -> /portfolio/
#   remote -> /portfolio/remote/  (noindex preview)
on:
  push:
    branches: [main, remote]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          path: main
      - name: Checkout remote
        uses: actions/checkout@v5
        with:
          ref: remote
          path: remote
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            main/package-lock.json
            remote/package-lock.json
      - name: Build main
        working-directory: main
        run: npm ci && npm run build
      - name: Build remote preview
        working-directory: remote
        env:
          BASE_PATH: /portfolio/remote
        run: npm ci && npm run build
      - name: Combine
        run: |
          mkdir site
          cp -r main/dist/. site/
          mkdir site/remote
          cp -r remote/dist/. site/remote/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
